##############################################################################
# SnowHealth Demand Forecasting — ML Pipeline (templatized)
#
# Deploy to DEV:  snow dcm deploy --from pipeline --target DEV
# Deploy to PROD: snow dcm deploy --from pipeline --target PROD
#
# DAG:
#   SNOWHEALTH_PIPELINE_ROOT
#     └─> SNOWHEALTH_TASK_FEATURE_ENGINEERING
#           └─> SNOWHEALTH_TASK_MODEL_TRAINING
#                 └─> SNOWHEALTH_TASK_MODEL_DEPLOYMENT
#   SNOWHEALTH_TASK_NOTIFY_COMPLETION (finalizer — runs on success or failure)
##############################################################################
definitions:

  # ── Code Bundles ─────────────────────────────────────────────────────────
  - resource: code_bundle
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_CB_FEATURE_ENGINEERING'
    from:
      type: asset
      asset: feature_engineering_bundle
    comment: Engineers 30+ features from raw pharmacy transactions

  - resource: code_bundle
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_CB_MODEL_TRAINING'
    from:
      type: asset
      asset: model_training_bundle
    comment: Trains XGBoost regressor and registers to Model Registry

  - resource: code_bundle
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_CB_MODEL_DEPLOYMENT'
    from:
      type: asset
      asset: model_deployment_bundle
    comment: Quality gate + promote default version + smoke test

  # ── Tasks (DAG) ─────────────────────────────────────────────────────────

  # Root task — scheduled trigger
  - resource: task
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_PIPELINE_ROOT'
    warehouse: '{{ warehouse }}'
    schedule:
      type: cron
      value: '{{ cron_schedule }}'
    definition:
      type: sql
      value: "SELECT 'SnowHealth ML Pipeline triggered' AS status"

  # Step 1: Feature Engineering
  - resource: task
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_TASK_FEATURE_ENGINEERING'
    warehouse: '{{ warehouse }}'
    predecessors:
      - '{{ database }}.{{ schema }}.SNOWHEALTH_PIPELINE_ROOT'
    definition:
      type: code_bundle
      name: '{{ database }}.{{ schema }}.SNOWHEALTH_CB_FEATURE_ENGINEERING'
      entrypoint: feature_engineering.py
      specification:
        bundle:
          type: ml
          compute_type: compute_pool
          language: python
          compute_options:
            compute_pool: '{{ compute_pool }}'
            query_warehouse: '{{ warehouse }}'
          env_vars:
            - DCM_DATABASE: '{{ database }}'
            - DCM_SCHEMA: '{{ schema }}'
          properties:
            result_stage: '@{{ schema }}.SNOWHEALTH_PIPELINE_RESULTS'

  # Step 2: Model Training
  - resource: task
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_TASK_MODEL_TRAINING'
    warehouse: '{{ warehouse }}'
    predecessors:
      - '{{ database }}.{{ schema }}.SNOWHEALTH_TASK_FEATURE_ENGINEERING'
    definition:
      type: code_bundle
      name: '{{ database }}.{{ schema }}.SNOWHEALTH_CB_MODEL_TRAINING'
      entrypoint: model_training.py
      specification:
        bundle:
          type: ml
          compute_type: compute_pool
          language: python
          compute_options:
            compute_pool: '{{ compute_pool }}'
            query_warehouse: '{{ warehouse }}'
          env_vars:
            - DCM_DATABASE: '{{ database }}'
            - DCM_SCHEMA: '{{ schema }}'
          properties:
            result_stage: '@{{ schema }}.SNOWHEALTH_PIPELINE_RESULTS'

  # Step 3: Model Deployment (quality gate → promote → smoke test)
  - resource: task
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_TASK_MODEL_DEPLOYMENT'
    warehouse: '{{ warehouse }}'
    predecessors:
      - '{{ database }}.{{ schema }}.SNOWHEALTH_TASK_MODEL_TRAINING'
    definition:
      type: code_bundle
      name: '{{ database }}.{{ schema }}.SNOWHEALTH_CB_MODEL_DEPLOYMENT'
      entrypoint: model_deployment.py
      specification:
        bundle:
          type: ml
          compute_type: compute_pool
          language: python
          compute_options:
            compute_pool: '{{ compute_pool }}'
            query_warehouse: '{{ warehouse }}'
          env_vars:
            - DCM_DATABASE: '{{ database }}'
            - DCM_SCHEMA: '{{ schema }}'
            - MODEL_VERSION: '{{ model_version }}'
          properties:
            result_stage: '@{{ schema }}.SNOWHEALTH_PIPELINE_RESULTS'

  # Finalizer — runs after root task completes (success or failure)
  - resource: task
    name: '{{ database }}.{{ schema }}.SNOWHEALTH_TASK_NOTIFY_COMPLETION'
    warehouse: '{{ warehouse }}'
    finalize: '{{ database }}.{{ schema }}.SNOWHEALTH_PIPELINE_ROOT'
    state: started
    definition:
      type: sql
      value: |-
        INSERT INTO {{ database }}.{{ schema }}.SNOWHEALTH_PIPELINE_DEPLOY_LOG
            (MODEL_NAME, VERSION, DEPLOYED_AT, RMSE, STATUS)
        SELECT
            'SNOWHEALTH_PIPELINE_MODEL',
            SYSTEM$TASK_RUNTIME_INFO('CURRENT_ROOT_TASK_UUID'),
            CURRENT_TIMESTAMP(),
            0,
            'PIPELINE_RUN_' || SYSTEM$TASK_RUNTIME_INFO('CURRENT_ROOT_TASK_NAME') || '_FINALIZED'
