##############################################################################
# SnowHealth Declarative Feature Store
#
# Plan:  snow feature plan  --from resources/feature_store --target DEV
# Apply: snow feature apply --from resources/feature_store --target DEV
#
# Feeds the SNOWHEALTH_PIPELINE task DAG (see pipeline/): the feature
# engineering task writes the batch source table, the feature store refresh
# task refreshes the feature view, and training/deployment read from it.
##############################################################################
manifest_version: 1
type: feature_store
default_target: DEV

targets:
  DEV:
    account_identifier: <YOUR_ORG>-<YOUR_ACCOUNT>
    database: DEV_SNOWHEALTH_ML_DB
    schema: SNOWHEALTH_PIPELINE_FS
    role: SNOWHEALTH_DEV_DEPLOYER
    templating_config: DEV

  PROD:
    account_identifier: <YOUR_ORG>-<YOUR_ACCOUNT>
    database: PRD_SNOWHEALTH_ML_DB
    schema: SNOWHEALTH_PIPELINE_FS
    role: SNOWHEALTH_PROD_DEPLOYER
    templating_config: PROD

templating:
  defaults:
    source_database: DEV_SNOWHEALTH_ML_DB
    source_schema: SNOWHEALTH_MODELS
    warehouse: COMPUTE_WH
  configurations:
    DEV:
      source_database: DEV_SNOWHEALTH_ML_DB
    PROD:
      source_database: PRD_SNOWHEALTH_ML_DB
