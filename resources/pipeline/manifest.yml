manifest_version: 2
type: DCM_PROJECT
default_target: DEV

targets:
  DEV:
    account_identifier: <YOUR_ORG>-<YOUR_ACCOUNT>
    project_name: "DEV_SNOWHEALTH_ML_DB.SNOWHEALTH_MODELS.SNOWHEALTH_PIPELINE"
    project_owner: SNOWHEALTH_DEV_DEPLOYER
    templating_config: DEV

  PROD:
    account_identifier: <YOUR_ORG>-<YOUR_ACCOUNT>
    project_name: "PRD_SNOWHEALTH_ML_DB.SNOWHEALTH_MODELS.SNOWHEALTH_PIPELINE"
    project_owner: SNOWHEALTH_PROD_DEPLOYER
    templating_config: PROD

templating:
  defaults:
    database: "DEV_SNOWHEALTH_ML_DB"
    schema: "SNOWHEALTH_MODELS"
    warehouse: "COMPUTE_WH"
    compute_pool: "SNOWHEALTH_COMPUTE_POOL"
    cron_schedule: "0 6 * * 1 America/New_York"
    model_version: "latest"
    fs_schema: "SNOWHEALTH_PIPELINE_FS"
    fv_name: "SNOWHEALTH_PIPELINE_FV"
    fv_version: "V1"

  configurations:
    DEV:
      database: "DEV_SNOWHEALTH_ML_DB"
      schema: "SNOWHEALTH_MODELS"

    PROD:
      database: "PRD_SNOWHEALTH_ML_DB"
      schema: "SNOWHEALTH_MODELS"
      cron_schedule: "0 4 * * 1 America/New_York"

assets:
  feature_engineering_bundle:
    path: 'code_bundles/feature_engineering/**/*'
  model_training_bundle:
    path: 'code_bundles/model_training/**/*'
  model_deployment_bundle:
    path: 'code_bundles/model_deployment/**/*'
