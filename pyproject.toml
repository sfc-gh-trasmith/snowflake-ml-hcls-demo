[project]
name = "snowflake-mlops-dcm"
version = "0.1.0"
description = "MLOps template for Snowflake using DCM, Feature Store, and GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "snowflake-ml-python>=2.6.0",
    "xgboost>=3.4.1",
]

[project.scripts]
snowflake-mlops-dcm = "snowflake_mlops_dcm:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
